name: Özellik isteği
description: Yeni bir özellik ya da iyileştirme önerisi
title: "[Özellik] "
labels: ["ozellik"]
body:
  - type: textarea
    id: problem
    attributes: { label: Hangi ihtiyacı çözüyor?, placeholder: "Ziyaretçi / üye / panel kullanıcısı olarak ..." }
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Öneri, description: "Ön yüz ve admin karşılığı birlikte düşünülür (dikey dilim)." }
    validations: { required: true }
  - type: dropdown
    id: area
    attributes:
      label: Alan
      multiple: true
      options: ["Ön yüz", "Yönetim paneli", "Konfigüratör", "Hesabım", "Veritabanı / RLS", "SEO / AI görünürlük", "Altyapı / dağıtım"]
  - type: textarea
    id: notes
    attributes: { label: Notlar, description: "İlgili karar (K-…), tasarım referansı, kısıtlar" }
